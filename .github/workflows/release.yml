name: Release archives
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release/**
      - scripts/install.sh
      - apps/neuve-cli/scripts/build.ts
      - apps/neuve-cli/src/cli.ts
      - apps/neuve-cli/src/upgrade-cli.ts
      - apps/neuve-cli/tests/upgrade-cli.test.ts
      - tests/release/**
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: linux-x64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      NEUVE_MODE: check
      CI: "1"
      NEUVE_TEST_SUITE_TIMEOUT_MS: "3300000"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: false
          persist-credentials: false
      - name: Read the pinned Graph source
        id: graph
        shell: bash
        run: |
          revision=$(git ls-tree HEAD apps/neuve-graph | awk '{print $3}')
          url=$(git config -f .gitmodules --get submodule.apps/neuve-graph.url)
          repository=${url#git@github.com:}
          repository=${repository#https://github.com/}
          repository=${repository%.git}
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || exit 1
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ steps.graph.outputs.repository }}
          ref: ${{ steps.graph.outputs.revision }}
          path: apps/neuve-graph
          ssh-key: ${{ secrets.NEUVE_GRAPH_DEPLOY_KEY }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: apps/neuve-graph/go.mod
          cache-dependency-path: apps/neuve-graph/go.sum
      - name: Prepare isolated directories
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/neuve-home" "$RUNNER_TEMP/neuve-tmp" "$RUNNER_TEMP/neuve-cache"
          echo "HOME=$RUNNER_TEMP/neuve-home" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP/neuve-tmp" >> "$GITHUB_ENV"
          echo "BUN_TMPDIR=$RUNNER_TEMP/neuve-tmp" >> "$GITHUB_ENV"
          echo "BUN_RUNTIME_TRANSPILER_CACHE_PATH=$RUNNER_TEMP/neuve-cache/transpiler" >> "$GITHUB_ENV"
      - run: bun --no-env-file install --frozen-lockfile
      - name: Select the release version
        id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(bun --no-env-file -p 'require("./apps/neuve-cli/package.json").version')
          if [ "$REF_TYPE" = tag ]; then
            [ "$REF_NAME" = "v$version" ] || { echo 'Tag and CLI package version differ.'; exit 1; }
          else
            revision=$(git rev-parse HEAD)
            version="$version-dev.${revision:0:12}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Build the native release
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: bun --no-env-file scripts/release/build.ts --target "$RELEASE_TARGET" --version "$RELEASE_VERSION" --out release-out --repository "$RELEASE_REPOSITORY"
      - name: Install zsh for the installer's startup-file tests
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends zsh
      - name: Show disk space and git versions before release tests
        run: |
          df -h "$GITHUB_WORKSPACE" "$TMPDIR"
          /usr/bin/git --version
          git --version
      - name: Exercise the release archive
        env:
          NEUVE_RELEASE_ARCHIVE: ${{ github.workspace }}/release-out/neuve-${{ matrix.target }}.tar.gz
        run: bun --no-env-file run test:release
      - name: Show disk space after release tests
        if: always()
        run: df -h "$GITHUB_WORKSPACE" "$TMPDIR"
      - name: Exercise the real Linux user manager
        if: runner.os == 'Linux'
        env:
          NEUVE_RELEASE_ARCHIVE: ${{ github.workspace }}/release-out/neuve-${{ matrix.target }}.tar.gz
        shell: bash
        run: |
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          ready=0
          deadline=$((SECONDS + 30))
          while (( SECONDS < deadline )); do
            state=$(timeout 1s systemctl --user is-system-running 2>/dev/null || true)
            case "$state" in running|degraded) ready=1; break ;; esac
            sleep 1
          done
          [ "$ready" = 1 ] || { echo 'The systemd user manager did not become ready within 30 seconds.'; exit 1; }
          NEUVE_RELEASE_SYSTEMD=1 bun --no-env-file scripts/test-budget.ts ./tests/release/systemd-native.test.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: neuve-${{ matrix.target }}
          path: release-out/neuve-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14
  checksums:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: false
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: neuve-*
          merge-multiple: true
          path: release-out
      # The installer ships stamped with the release's version, as bun run release stamps it, so it
      # installs its own release by default and release --from accepts the folder.
      - run: bun --no-env-file scripts/release/stamp.ts release-out
      - run: bun --no-env-file scripts/release/checksums.ts release-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: neuve-release
          path: release-out/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: checksums
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: neuve-release
          path: release-out
      - name: Attest public release files
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: release-out/*
      - name: Create the owner-reviewed draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        # A tag with a prerelease part (v0.1.0-preview.3) drafts a prerelease. Any other drafts a full
        # release marked latest, which the one-line install (releases/latest/download) resolves to.
        run: |
          version=${RELEASE_TAG#v}
          case "${version%%+*}" in *-*) kind=--prerelease ;; *) kind=--latest ;; esac
          gh release create "$RELEASE_TAG" --draft "$kind" --verify-tag --generate-notes release-out/*
