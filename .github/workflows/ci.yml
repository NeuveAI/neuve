# portable is the required PR check and includes release archives when release-scope selects them.
# Graph is public; each native platform builds it once and shares it with every test shard.
# Release archive tests use five macOS runners for release dependencies, main pushes or manual runs.
# Mac storage/WAL lifetime and installed-copy checks remain local.
name: Portable checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  release-scope:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            paths=$(git diff --name-only "$BASE" "$HEAD" -- \
              scripts/install.sh 'scripts/release/**' 'tests/release/**' \
              'apps/neuve-cli/src/release*' apps/neuve-cli/src/install-manifest.ts \
              apps/neuve-cli/src/worker-cli.ts apps/neuve-cli/src/upgrade-cli.ts \
              apps/neuve-cli/src/installation.ts packages/records-core/src/systemd.ts \
              packages/records-core/src/launchd.ts apps/neuve-graph package.json bun.lock '.github/**')
            if [ -n "$paths" ]; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
            else
              echo 'changed=false' >> "$GITHUB_OUTPUT"
            fi
          fi
  graph-build:
    needs: release-scope
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["macos-15"]' || needs.release-scope.outputs.changed == 'true' && '["ubuntu-latest","macos-15"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/graph-source
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: apps/neuve-graph/go.mod
          cache-dependency-path: apps/neuve-graph/go.sum
      - name: Build the native Graph artifact
        # Match the release engine's flags. Graph's tree-sitter grammars require native CGO.
        env:
          CGO_ENABLED: "1"
        run: |
          go -C apps/neuve-graph build -trimpath -o entire-graph ./cmd/entire-graph
          apps/neuve-graph/entire-graph version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: graph-${{ matrix.runner }}
          path: apps/neuve-graph/entire-graph
          if-no-files-found: error
          retention-days: 1
  portable-checks:
    needs: graph-build
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        group:
          [
            packages,
            cli-1,
            cli-2,
            harness-1,
            harness-2,
            harness-3,
            harness-4,
            harness-5,
            harness-6,
            harness-7,
            harness-8,
          ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEUVE_CI_GROUP: ${{ matrix.group }}
      NEUVE_MODE: check
      CI: "1"
      ROLLDOWN_WORKER_THREADS: "4"
      RAYON_NUM_THREADS: "4"
      NEUVE_TEST_SUITE_TIMEOUT_MS: "660000"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: false
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - uses: ./.github/actions/graph-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: graph-ubuntu-latest
          path: apps/neuve-graph
      - name: Enable the native Graph artifact
        run: |
          chmod +x apps/neuve-graph/entire-graph
          apps/neuve-graph/entire-graph version
      - name: Prepare isolated check directories
        # The same folders run_modal.py gives the plan. They stay outside the runner's own home
        # (/home/runner, which holds $RUNNER_TEMP), because tests that refuse to run in a real home
        # treat every folder under it as one.
        run: |
          mkdir -p /tmp/check-home /tmp/check-tmp /tmp/check-cache
          echo "HOME=/tmp/check-home" >> "$GITHUB_ENV"
          echo "TMPDIR=/tmp/check-tmp" >> "$GITHUB_ENV"
          echo "BUN_TMPDIR=/tmp/check-tmp" >> "$GITHUB_ENV"
          echo "BUN_RUNTIME_TRANSPILER_CACHE_PATH=/tmp/check-cache/transpiler" >> "$GITHUB_ENV"
      - run: bun --no-env-file install --frozen-lockfile
      - if: matrix.group == 'packages'
        run: bun --no-env-file run format:check
      - name: Report Git prerequisite identities
        if: matrix.group == 'packages'
        run: |
          for executable in "$(command -v git)" /usr/lib/git-core/git; do
            if [ -x "$executable" ]; then
              readlink -f "$executable"
              stat -c '%d %i %s' "$executable"
              sha256sum "$executable"
              "$executable" version
            fi
          done
      - name: Build portable declarations
        if: matrix.group == 'packages'
        run: |
          cp scripts/remote-check/build-types.ts .remote-build-types.ts
          cp scripts/remote-check/check-ace.ts .remote-check-ace.ts
          printf '/.remote-*.ts\n' >> .git/info/exclude
          bun --no-env-file .remote-build-types.ts
          cd apps/neuve-web/packages/diffs
          bun --no-env-file node_modules/typescript/bin/tsc -p tsconfig.build.json
      - name: Run the check:remote Linux plan
        # Each heavy suite uses file shards on separate Linux runners, so one shard can use both
        # CPUs without starving another shard's scan children. The packages group owns all other
        # tests, typechecks and formatting. Every selected part runs even after a failure.
        run: |
          bun --no-env-file --eval '
            import { remotePlan } from "./scripts/check-remote.ts";
            const revision = Bun.spawnSync(["git", "rev-parse", "HEAD"]).stdout.toString().trim();
            const failed = [];
            const plan = await remotePlan(process.cwd(), revision, { graph: true });
            const group = process.env.NEUVE_CI_GROUP;
            const heavy = /^test-neuve-(cli|harness)$/;
            const parts = group === "packages"
              ? plan.filter(part => !heavy.test(part.id))
              : plan.filter(part => part.id === `test-neuve-${group.split("-")[0]}`);
            if (parts.length === 0) throw new Error(`No check parts selected for ${group}`);
            for (const part of parts) {
              if (group !== "packages" && part.testArguments === undefined)
                throw new Error(`No test arguments for ${part.id}`);
              const command = group === "packages" ? part.command : [
                process.execPath, "--no-env-file", `${process.cwd()}/scripts/test-budget.ts`,
                "./tests", ...part.testArguments,
                `--shard=${group.split("-")[1]}/${group.startsWith("cli") ? 2 : 8}`,
                ...(group.startsWith("harness") ? ["--timings=test-timings.json"] : []),
              ];
              console.log(`Running ${part.id}`);
              const child = Bun.spawn(command, {
                cwd: part.cwd, stdin: "ignore", stdout: "inherit", stderr: "inherit",
                timeout: 660_000,
              });
              const code = await child.exited;
              if (code !== 0) {
                console.log(`::error::${part.id} exited ${code}`);
                failed.push(part.id);
              }
            }
            if (failed.length > 0) {
              console.log(`Failed parts: ${failed.join(", ")}`);
              process.exit(1);
            }
          '
  portable:
    needs: [portable-checks, release-scope, release-archive]
    if: always() && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Require portable groups and selected release archives
        shell: bash
        env:
          PORTABLE: ${{ needs.portable-checks.result }}
          SCOPE: ${{ needs.release-scope.result }}
          CHANGED: ${{ needs.release-scope.outputs.changed }}
          ARCHIVE: ${{ needs.release-archive.result }}
        run: |
          test "$PORTABLE" = success
          test "$SCOPE" = success
          case "$CHANGED:$ARCHIVE" in
            true:success|false:skipped) ;;
            *) echo "::error::Unexpected release result: $CHANGED:$ARCHIVE"; exit 1 ;;
          esac
  release-archive:
    needs: [release-scope, graph-build]
    if: needs.release-scope.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    runs-on: macos-15
    timeout-minutes: 40
    env:
      NEUVE_MODE: check
      CI: "1"
      ROLLDOWN_WORKER_THREADS: "4"
      RAYON_NUM_THREADS: "4"
      NEUVE_TEST_SUITE_TIMEOUT_MS: "1800000"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: false
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - uses: ./.github/actions/graph-source
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: apps/neuve-graph/go.mod
          cache-dependency-path: apps/neuve-graph/go.sum
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: graph-macos-15
          path: apps/neuve-graph
      - name: Enable the native Graph artifact
        run: |
          chmod +x apps/neuve-graph/entire-graph
          apps/neuve-graph/entire-graph version
      - name: Prepare isolated release directories
        run: |
          echo "GOPATH=$(go env GOPATH)" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$(go env GOMODCACHE)" >> "$GITHUB_ENV"
          # The installer records physical paths. A symlink spelling of HOME would make mocked
          # launchctl registrations appear to belong to another command during uninstall.
          check_root=$(cd "$RUNNER_TEMP" && pwd -P)
          echo "Runner temp: $RUNNER_TEMP; physical temp: $check_root"
          mkdir -p "$check_root/neuve-home" "$check_root/neuve-tmp" "$check_root/neuve-cache"
          echo "HOME=$check_root/neuve-home" >> "$GITHUB_ENV"
          echo "TMPDIR=$check_root/neuve-tmp" >> "$GITHUB_ENV"
          echo "BUN_TMPDIR=$check_root/neuve-tmp" >> "$GITHUB_ENV"
          echo "BUN_RUNTIME_TRANSPILER_CACHE_PATH=$check_root/neuve-cache/transpiler" >> "$GITHUB_ENV"
      - run: bun --no-env-file install --frozen-lockfile
      - name: Run release archive tests
        # Bun shards by file. The two large installer files divide their cases separately;
        # together these five jobs register every case once. All hosted launchd cases run after NEU-405.
        env:
          RELEASE_SHARD: ${{ matrix.shard }}
        run: |
          bun run test:release --shard="$RELEASE_SHARD/5" --path-ignore-patterns='tests/release/{distribution,systemd-installer}.test.ts'
          NEUVE_RELEASE_CASE_SHARD="$RELEASE_SHARD/5" bun scripts/test-budget.ts ./tests/release/distribution.test.ts ./tests/release/systemd-installer.test.ts
