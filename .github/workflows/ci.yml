# Linux portable is the required PR check. Graph coverage runs when the deploy key is available.
# Release archive tests use four macOS runners only for installer/release changes or a manual run.
# Mac storage/WAL lifetime and installed-copy checks remain local.
name: Portable checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-scope:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = pull_request ] && git diff --name-only "$BASE" "$HEAD" -- scripts/install.sh 'scripts/release/**' 'tests/release/**' 'apps/neuve-cli/src/release*' | grep -q .; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEUVE_MODE: check
      CI: "1"
      ROLLDOWN_WORKER_THREADS: "4"
      RAYON_NUM_THREADS: "4"
      NEUVE_TEST_SUITE_TIMEOUT_MS: "3300000"
      # Fork PRs cannot read the private Graph repository. A successful Graph build below clears
      # this declaration, so missing prerequisites then fail instead of silently skipping.
      NEUVE_CHECK_WITHOUT_GRAPH: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: false
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Read the pinned Graph source
        id: graph
        env:
          GRAPH_KEY: ${{ secrets.NEUVE_GRAPH_DEPLOY_KEY }}
        shell: bash
        run: |
          if [ -z "$GRAPH_KEY" ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Graph unavailable: fork PRs do not receive the private submodule deploy key.'
            exit 0
          fi
          echo 'available=true' >> "$GITHUB_OUTPUT"
          revision=$(git ls-tree HEAD apps/neuve-graph | awk '{print $3}')
          url=$(git config -f .gitmodules --get submodule.apps/neuve-graph.url)
          repository=${url#git@github.com:}
          repository=${repository#https://github.com/}
          repository=${repository%.git}
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || exit 1
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
      - if: steps.graph.outputs.available == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ steps.graph.outputs.repository }}
          ref: ${{ steps.graph.outputs.revision }}
          path: apps/neuve-graph
          ssh-key: ${{ secrets.NEUVE_GRAPH_DEPLOY_KEY }}
          persist-credentials: false
      - if: steps.graph.outputs.available == 'true'
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: apps/neuve-graph/go.mod
          cache-dependency-path: apps/neuve-graph/go.sum
      - name: Build Graph and enable its cases
        if: steps.graph.outputs.available == 'true'
        run: |
          time bun run build:graph
          echo 'NEUVE_CHECK_WITHOUT_GRAPH=0' >> "$GITHUB_ENV"
      - name: Prepare isolated check directories
        # The same folders run_modal.py gives the plan. They stay outside the runner's own home
        # (/home/runner, which holds $RUNNER_TEMP), because tests that refuse to run in a real home
        # treat every folder under it as one.
        run: |
          mkdir -p /tmp/check-home /tmp/check-tmp /tmp/check-cache
          echo "HOME=/tmp/check-home" >> "$GITHUB_ENV"
          echo "TMPDIR=/tmp/check-tmp" >> "$GITHUB_ENV"
          echo "BUN_TMPDIR=/tmp/check-tmp" >> "$GITHUB_ENV"
          echo "BUN_RUNTIME_TRANSPILER_CACHE_PATH=/tmp/check-cache/transpiler" >> "$GITHUB_ENV"
          # One test shard per CPU, at most the four the plan's 15-second window was set for (four
          # per four-CPU Modal sandbox). A private repository's runner has two CPUs, a public one's
          # four; four shards on two CPUs starve the capture scan children past that window.
          shards=$(nproc); [ "$shards" -gt 4 ] && shards=4
          echo "NEUVE_TEST_SHARDS=$shards" >> "$GITHUB_ENV"
      - run: bun --no-env-file install --frozen-lockfile
      - run: bun --no-env-file run format:check
      - name: Build portable declarations
        run: |
          cp scripts/remote-check/build-types.ts .remote-build-types.ts
          cp scripts/remote-check/check-ace.ts .remote-check-ace.ts
          printf '/.remote-*.ts\n' >> .git/info/exclude
          bun --no-env-file .remote-build-types.ts
          cd apps/neuve-web/packages/diffs
          bun --no-env-file node_modules/typescript/bin/tsc -p tsconfig.build.json
      - name: Run the check:remote Linux plan
        # remotePlan owns package selection, Graph exclusions and the 15-second CLI/harness
        # test window. run_modal.py uses the same four native worker threads and 55-minute limit.
        # Every part runs, so one run shows every failing part; the step fails if any part did.
        run: |
          bun --no-env-file --eval '
            import { remotePlan } from "./scripts/check-remote.ts";
            const revision = Bun.spawnSync(["git", "rev-parse", "HEAD"]).stdout.toString().trim();
            const failed = [];
            for (const part of await remotePlan(process.cwd(), revision)) {
              console.log(`Running ${part.id}`);
              const child = Bun.spawn(part.command, {
                cwd: part.cwd, stdin: "ignore", stdout: "inherit", stderr: "inherit",
                timeout: 3_300_000,
              });
              const code = await child.exited;
              if (code !== 0) {
                console.log(`::error::${part.id} exited ${code}`);
                failed.push(part.id);
              }
            }
            if (failed.length > 0) {
              console.log(`Failed parts: ${failed.join(", ")}`);
              process.exit(1);
            }
          '
  release-archive:
    needs: release-scope
    if: needs.release-scope.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: macos-15
    timeout-minutes: 25
    env:
      NEUVE_MODE: check
      CI: "1"
      ROLLDOWN_WORKER_THREADS: "4"
      RAYON_NUM_THREADS: "4"
      NEUVE_TEST_SUITE_TIMEOUT_MS: "1200000"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: false
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Read the pinned Graph source
        id: graph
        env:
          GRAPH_KEY: ${{ secrets.NEUVE_GRAPH_DEPLOY_KEY }}
        shell: bash
        run: |
          if [ -z "$GRAPH_KEY" ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Graph unavailable: fork PRs do not receive the private submodule deploy key.'
            exit 0
          fi
          echo 'available=true' >> "$GITHUB_OUTPUT"
          revision=$(git ls-tree HEAD apps/neuve-graph | awk '{print $3}')
          url=$(git config -f .gitmodules --get submodule.apps/neuve-graph.url)
          repository=${url#git@github.com:}
          repository=${repository#https://github.com/}
          repository=${repository%.git}
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || exit 1
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
      - if: steps.graph.outputs.available == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ steps.graph.outputs.repository }}
          ref: ${{ steps.graph.outputs.revision }}
          path: apps/neuve-graph
          ssh-key: ${{ secrets.NEUVE_GRAPH_DEPLOY_KEY }}
          persist-credentials: false
      - if: steps.graph.outputs.available == 'true'
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: apps/neuve-graph/go.mod
          cache-dependency-path: apps/neuve-graph/go.sum
      - name: Prepare isolated release directories
        run: |
          echo "GOPATH=$(go env GOPATH)" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$(go env GOMODCACHE)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/neuve-home" "$RUNNER_TEMP/neuve-tmp" "$RUNNER_TEMP/neuve-cache"
          echo "HOME=$RUNNER_TEMP/neuve-home" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP/neuve-tmp" >> "$GITHUB_ENV"
          echo "BUN_TMPDIR=$RUNNER_TEMP/neuve-tmp" >> "$GITHUB_ENV"
          echo "BUN_RUNTIME_TRANSPILER_CACHE_PATH=$RUNNER_TEMP/neuve-cache/transpiler" >> "$GITHUB_ENV"
      - run: bun --no-env-file install --frozen-lockfile
      - name: Build native Graph prerequisite
        if: steps.graph.outputs.available == 'true'
        run: bun run build:graph
      - name: Run release archive tests
        # Bun shards by file. The large distribution file therefore shards its cases separately;
        # together these four jobs register every case once. Existing NEU-405 launchd skips stay.
        env:
          RELEASE_SHARD: ${{ matrix.shard }}
        run: |
          bun run test:release --shard="$RELEASE_SHARD/4" --path-ignore-patterns='tests/release/distribution.test.ts'
          NEUVE_DISTRIBUTION_SHARD="$RELEASE_SHARD/4" bun scripts/test-budget.ts ./tests/release/distribution.test.ts
