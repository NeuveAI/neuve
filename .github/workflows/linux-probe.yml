name: Linux observer diagnosis
on:
  push:
    branches: [portable-ci]
permissions:
  contents: read
jobs:
  observer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEUVE_MODE: check
      TMPDIR: /tmp/check-tmp
      BUN_TMPDIR: /tmp/check-tmp
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.4"
      - run: mkdir -p /tmp/check-tmp
      - run: bun --no-env-file install --frozen-lockfile
      - name: Verify committed reads on Linux
        run: |
          for attempt in 1 2 3; do
            bun scripts/test-budget.ts apps/neuve-web/apps/web/src/server/live-events.test.ts packages/harness/tests/shared-worker-delivery.test.ts --timeout 40000 || exit 1
          done
