name: Feature request
description: Propose a change to what Neuve does
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please open this before writing code for a feature, so we can agree on it first. Use Neuve's terms from the [product vocabulary](https://github.com/NeuveAI/neuve/blob/main/vocabulary.md).
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do in a review, and what got in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: What Neuve would do instead. Say which surface it touches (CLI, batch overview, review desk, coding workspace) if you know.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What else you considered
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and the [design decisions](https://github.com/NeuveAI/neuve/blob/main/process/decisions.md) and found nothing that settles this.
          required: true
        - label: I'm willing to send a pull request once we agree on it.
