/* ── FILE HEADER (diff-file.tsx FileHeader, round 3 #1–2; measured from review-desk-diff-file--owned-ranges). One block on

.fh{position:relative;height:44px;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:0 8px 0 6px;background:var(--surface);border-bottom:1px solid var(--line2)}

.fbtn{position:relative;width:28px;height:28px;flex:0 0 auto;border:0;padding:0;border-radius:7px;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;transition:background-color var(--nv-dur-surface-tone) var(--nv-ease-standard),color var(--nv-dur-surface-tone) var(--nv-ease-standard)}
.fbtn::after{content:"";position:absolute;top:-8px;bottom:-8px;left:-6px;right:-10px}

/* ── DIFF ROW (the diff's gutter at HEAD, measured from review-desk-diff-file--owned-ranges). One block on Ranges, Margin and
   Threads: keep the copies identical. One number cell holds the old and the new number (11.5px, --nw wide each, 10px apart;
   14px in, 17px out) with the sign at its right edge (4px in, the diff colour); the code cell starts 7.5px in. --nw is the
   widest number's width: 2 digits 14px, 3 digits 21px, 4 digits 28px. ── */
.row{display:grid;grid-template-columns:calc(41px + var(--nw,21px) * 2) minmax(0,1fr);height:24px;align-items:center;font-family:'Geist Mono',ui-monospace,monospace;font-size:12.5px;line-height:24px}

   A phrase that describes part of the change is the link: ink, a quiet underline that turns ink on real hover, the focus
   ring on keyboard focus (criteria-card.tsx REVIEW_LINK). An anchor, so a long phrase wraps with its sentence.
   In the briefing a citation chip shows only its marker-kind icon; its name and tooltip say the kind and the target
   (marker-kind.tsx CitationChip, iconOnly), kept on one line with the punctuation after it. One treatment for every entry

/* Engaged pin (round-5.md, 2026-10-15): while a pin's list or one of its cards is open, whichever entry point opened it,
   its lines show it. The board names those lines on its scope: data-engaged="tN". As the code (lib/diffs.ts): the code cells keep
   the hover tint (--nv-lit) under the text and carry a 2px outline in --nv-engaged-ring round the range (sides on every row, the top
   on the first, the bottom on the last; inset on the code cell, so the sticky gutter never covers it); the number cells sit outside
   the outline with the stronger open tint (--nv-range-strong: accent 28%, 21% in dark) and their own number colour
   (--nv-ln, --nv-add-ln, --nv-del-ln). In a split row only the side that holds the line is engaged: the new side, the right half.
   The outline eases in with the line tint and, like it, is instant under reduced motion. A landing on engaged lines keeps the
   outline and fades back to the engaged tint, not to nothing. Selectors are raised ([data-lscope], .lrow.lrow) to stay above the
   hover rules on the same lines. */
.lscope{--eng-num:var(--nv-range-strong);--eng-ring:var(--nv-engaged-ring)}
[data-lscope].lscope[data-engaged~="t1"] .lrow.lrow.t1,
[data-lscope].lscope[data-engaged~="t2"] .lrow.lrow.t2,
[data-lscope].lscope[data-engaged~="t3"] .lrow.lrow.t3,
[data-lscope].lscope[data-engaged~="t4"] .lrow.lrow.t4,
[data-lscope].lscope[data-engaged~="t5"] .lrow.lrow.t5,
[data-lscope].lscope[data-engaged~="t6"] .lrow.lrow.t6,
[data-lscope].lscope[data-engaged~="t7"] .lrow.lrow.t7,
[data-lscope].lscope[data-engaged~="t8"] .lrow.lrow.t8,
[data-lscope].lscope[data-engaged~="t9"] .lrow.lrow.t9,
[data-lscope].lscope[data-engaged~="t10"] .lrow.lrow.t10{--eng-top:transparent;--eng-bot:transparent}

      return { kind: r[0], o: o, no: r[0] === 'del' ? '' : r[1], sign: r[0] === 'add' ? '+' : (r[0] === 'del' ? '−' : ''), toks: tokenize(r[2]), lit: '', tc: tc };
    });
    var pins = PINS.map(function (p) {
      var first = p.items[0];
      var multi = p.items.length > 1;
      var lead = p.items.slice().sort(function (a, b) { return PRIO.indexOf(a.tone) - PRIO.indexOf(b.tone); })[0];
      return {
        top: topFor(p.row), lt: pinTgt(p), tone: K[lead.tone].fam, paths: K[lead.tone].paths, dash: !!K[lead.tone].dash, ic: icOf(lead.tone),
        label: K[lead.tone].label, hasTgt: !multi && !!first.tgt, tgt: first.tgt,
        multi: multi, count: p.items.length, on: held === p.id ? 'on' : '',
        // only an open CARD isolates the other pins (isolatingAtom): a pinned list engages its lines but leaves them usable
        iso: st.open && st.open !== p.id ? 'iso' : '', go: st.open && st.open !== p.id ? '' : 'go-' + pinTgt(p), // isolation drops the hint (hintGroup && !isolating)
        tab: st.open && st.open !== p.id ? -1 : 0, expanded: held === p.id ? 'true' : 'false',
        aria: K[lead.tone].label + ' on line ' + p.row + (multi ? ', ' + p.items.length + ' markers' : ''),
        enter: function () { if (!self.state.open && !self.state.pinned && self.state.hover !== p.id) self.setState({ hover: p.id }); },
        focus: function (e) { if (e && e.target && e.target.matches && e.target.matches(':focus-visible') && !self.state.open && !self.state.pinned && self.state.hover !== p.id) self.setState({ hover: p.id }); },
        blur: function () { if (!self.state.open && !self.state.pinned && self.state.hover !== null) self.setState({ hover: null }); },
        click: function () {
          if (self.state.open === p.id) self.setState({ open: null, hover: null });
          else if (self.state.pinned === p.id) self.setState({ pinned: null, hover: null });
          else if (multi) self.setState({ pinned: p.id, hover: null, open: null });
          else { self.setState({ open: p.id, item: 0, hover: null }); landOn('margin', pinTgt(p), self.props)(); }
        }
      };
    });
    var peekPin = !st.open && (st.pinned || st.hover) ? activePin : null;
    var peek = peekPin ? {
      top: topFor(peekPin.row) + 28, aria: peekPin.items.length + ' markers',
      items: peekPin.items.map(function (it, i) {
        return { kind: it.kind, why: it.why, meta: it.meta, paths: K[it.tone].paths, dash: !!K[it.tone].dash, ic: icOf(it.tone), color: C[it.tone], open: function () { self.setState({ open: peekPin.id, item: i, hover: null, pinned: null }); landOn('margin', pinTgt(peekPin), self.props)(); } };
      })
    } : null;
    var openPin = st.open ? activePin : null;
    var ci = openPin ? openPin.items[st.item] : null;
    var card = ci ? { top: topFor(openPin.row) + 28, kind: ci.kind, title: ci.title, meta: ci.meta, why: ci.why, paths: K[ci.tone].paths, dash: !!K[ci.tone].dash, ic: icOf(ci.tone), color: C[ci.tone], tile: TILE[ci.tone] } : null;
    var theme = st.theme || this.props.theme || 'light';
    var folded = st.folded;
    return {
      open: !folded, expanded: folded ? 'false' : 'true', foldLabel: (folded ? 'Expand' : 'Collapse') + ' live-review.ts',
      fhCls: (folded ? 'folded' : '') + (st.viewed ? ' viewed' : ''), viewed: st.viewed,
      fold: function () { self.setState({ folded: !self.state.folded, open: null, pinned: null, hover: null }); },
      toggleViewed: function () { var v = !self.state.viewed; self.setState({ viewed: v, folded: v, open: null, pinned: null, hover: null }); },
      theme: theme, rows: rows, pins: folded ? [] : pins, engaged: held ? pinTgt(activePin) : '',
      showPeek: !!peek, peek: peek || { items: [] }, showCard: !!card, card: card || {},
      keep: function () {},
      leave: function () { if (!self.state.open && !self.state.pinned && self.state.hover !== null) self.setState({ hover: null }); },
      close: function () { self.setState({ open: null, hover: null }); },
      noop: function () {}
    };
  }
}
