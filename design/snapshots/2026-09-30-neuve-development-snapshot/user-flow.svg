<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Intended Neuve user flow</title>
  <desc id="desc">A two-row flow from established scope through current batch capture, hunk-based review units, context and lane assignment, the implementer and adversarial reviewer loop, final human review, recorded dispositions, and later reuse or invalidation. Purple nodes are implemented substrate; green nodes are established product rules; amber nodes are planned product work.</desc>
  <defs>
    <style>
      :root { color-scheme: light dark; }
      .bg { fill: #fbfaf7; }
      .title { fill: #20252b; font: 600 28px system-ui, sans-serif; }
      .subtitle { fill: #5f6975; font: 400 16px system-ui, sans-serif; }
      .label { fill: #20252b; font: 600 15px system-ui, sans-serif; }
      .copy { fill: #5f6975; font: 400 13px system-ui, sans-serif; }
      .kicker { fill: #5f6975; font: 600 11px system-ui, sans-serif; letter-spacing: 1px; }
      .established { fill: #e9f4e7; stroke: #5b8f58; }
      .implemented { fill: #eee8fb; stroke: #7b61b5; }
      .open { fill: #fff2d8; stroke: #b98934; }
      .line { stroke: #87919c; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #b98934; stroke-width: 2; fill: none; marker-end: url(#arrowAmber); }
      .legend { fill: #5f6975; font: 400 13px system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#87919c"/></marker>
    <marker id="arrowAmber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b98934"/></marker>
  </defs>
  <rect class="bg" width="1440" height="760"/>
  <text class="title" x="54" y="54">From intended change to attributable decision</text>
  <text class="subtitle" x="54" y="82">Product flow — technical observations support the journey but never replace the hunk-based decision unit.</text>

  <g transform="translate(54 114)">
    <rect class="established" x="0" y="0" width="238" height="138" rx="12"/>
    <text class="kicker" x="18" y="26">1 · AUTHORITY</text>
    <text class="label" x="18" y="53">Pin scope and intent</text>
    <text class="copy" x="18" y="79">Constraints, non-goals and</text><text class="copy" x="18" y="98">definition of done are settled</text><text class="copy" x="18" y="117">before the inner loop.</text>

    <path class="line" d="M244 69 H278"/>
    <rect class="open" x="286" y="0" width="238" height="138" rx="12"/>
    <text class="kicker" x="304" y="26">2 · CHANGE</text>
    <text class="label" x="304" y="53">Capture revision or batch</text>
    <text class="copy" x="304" y="79">Committed base remains durable.</text><text class="copy" x="304" y="98">Staged, unstaged and new work</text><text class="copy" x="304" y="117">remains unapproved.</text>

    <path class="line" d="M530 69 H564"/>
    <rect class="open" x="572" y="0" width="238" height="138" rx="12"/>
    <text class="kicker" x="590" y="26">3 · PRODUCT PRIMITIVE</text>
    <text class="label" x="590" y="53">Hunks → review units</text>
    <text class="copy" x="590" y="79">Group nearby hunks for one</text><text class="copy" x="590" y="98">decision scope; recompute the</text><text class="copy" x="590" y="117">grouping on later cycles.</text>

    <path class="line" d="M816 69 H850"/>
    <rect class="implemented" x="858" y="0" width="238" height="138" rx="12"/>
    <text class="kicker" x="876" y="26">4 · CONTEXT SUBSTRATE</text>
    <text class="label" x="876" y="53">Retrieve qualified context</text>
    <text class="copy" x="876" y="79">Revision-bound candidates and</text><text class="copy" x="876" y="98">requested relationships retain</text><text class="copy" x="876" y="117">coverage and limitations.</text>

    <path class="line" d="M1102 69 H1136"/>
    <rect class="open" x="1144" y="0" width="238" height="138" rx="12"/>
    <text class="kicker" x="1162" y="26">5 · PRODUCT INTERPRETATION</text>
    <text class="label" x="1162" y="53">Markers, briefing and lane</text>
    <text class="copy" x="1162" y="79">Attribute fragments to hunks,</text><text class="copy" x="1162" y="98">assess the whole unit, then</text><text class="copy" x="1162" y="117">assign review responsibility.</text>

    <path class="line" d="M1263 144 V194"/>

    <rect class="established" x="1144" y="202" width="238" height="138" rx="12"/>
    <text class="kicker" x="1162" y="228">6 · INNER LOOP</text>
    <text class="label" x="1162" y="255">Implement ↔ challenge</text>
    <text class="copy" x="1162" y="281">Adversarial review gates the</text><text class="copy" x="1162" y="300">decision, evidence design and</text><text class="copy" x="1162" y="319">implementation.</text>

    <path class="line" d="M1138 271 H1104"/>
    <rect class="open" x="858" y="202" width="238" height="138" rx="12"/>
    <text class="kicker" x="876" y="228">7 · FINAL PROCESSING</text>
    <text class="label" x="876" y="255">Agentic disposition</text>
    <text class="copy" x="876" y="281">Automated and agentic work</text><text class="copy" x="876" y="300">finishes before the human</text><text class="copy" x="876" y="319">review stage.</text>

    <path class="line" d="M852 271 H818"/>
    <rect class="open" x="572" y="202" width="238" height="138" rx="12"/>
    <text class="kicker" x="590" y="228">8 · LAST GATE</text>
    <text class="label" x="590" y="255">Human judgment</text>
    <text class="copy" x="590" y="281">Suggested work has an agent</text><text class="copy" x="590" y="300">disposition; required work still</text><text class="copy" x="590" y="319">needs the human decision.</text>

    <path class="line" d="M566 271 H532"/>
    <rect class="open" x="286" y="202" width="238" height="138" rx="12"/>
    <text class="kicker" x="304" y="228">9 · DURABLE OUTCOME</text>
    <text class="label" x="304" y="255">Record disposition and history</text>
    <text class="copy" x="304" y="281">Keep outcomes connected to</text><text class="copy" x="304" y="300">units, revisions, evidence and</text><text class="copy" x="304" y="319">correction attribution.</text>

    <path class="line" d="M280 271 H246"/>
    <rect class="established" x="0" y="202" width="238" height="138" rx="12"/>
    <text class="kicker" x="18" y="228">10 · NEXT CYCLE</text>
    <text class="label" x="18" y="255">Reuse or invalidate</text>
    <text class="copy" x="18" y="281">Reuse valid material. A new</text><text class="copy" x="18" y="300">decision signal reopens only</text><text class="copy" x="18" y="319">affected work.</text>

    <path class="loop" d="M119 348 V394 H691 V348"/>
    <text class="copy" x="306" y="420">Later change or discovered evidence defect can create a renewed decision signal without erasing history.</text>
  </g>

  <g transform="translate(54 680)">
    <circle cx="7" cy="0" r="7" fill="#5b8f58"/><text class="legend" x="22" y="5">Established product rule</text>
    <circle cx="227" cy="0" r="7" fill="#7b61b5"/><text class="legend" x="242" y="5">Implemented substrate</text>
    <circle cx="447" cy="0" r="7" fill="#b98934"/><text class="legend" x="462" y="5">Planned product behavior</text>
  </g>
</svg>
