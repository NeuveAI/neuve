<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040" role="img" aria-labelledby="title desc">
  <title id="title">Current Neuve query runtime sequence</title>
  <desc id="desc">Sequence diagram for the implementation at Neuve revision 7fc1d17. A caller invokes the CLI with a question and explicit relationship plan. The graph client resolves a Git revision, creates an isolated view, discovers Graph capabilities, retrieves and qualifies candidates, emits retrieval, optionally retrieves relationships, cleans the worktree, then emits completion. Failure and cancellation clean up without emitting completion.</desc>
  <defs>
    <style>
      :root { color-scheme: light dark; }
      .bg { fill:#fbfaf7; }
      .head { fill:#eef0f2; stroke:#929ca6; }
      .headPublic { fill:#eaf6f8; stroke:#4d99a7; }
      .headBoundary { fill:#fff2d8; stroke:#b98934; }
      .headGraph { fill:#eee8fb; stroke:#7b61b5; }
      .life { stroke:#a7afb7; stroke-width:1.5; stroke-dasharray:6 7; }
      .msg { stroke:#66717c; stroke-width:1.7; fill:none; marker-end:url(#arrow); }
      .return { stroke:#4d99a7; stroke-width:1.7; stroke-dasharray:6 5; fill:none; marker-end:url(#arrowCyan); }
      .event { stroke:#7b61b5; stroke-width:2.2; fill:none; marker-end:url(#arrowPurple); }
      .failure { fill:#fbe9e7; stroke:#b55d55; }
      .loop { fill:#fff8ea; stroke:#b98934; }
      .title { fill:#20252b; font:600 28px system-ui,sans-serif; }
      .subtitle { fill:#5f6975; font:400 15px system-ui,sans-serif; }
      .actor { fill:#20252b; font:600 13px system-ui,sans-serif; text-anchor:middle; }
      .text { fill:#20252b; font:500 13px system-ui,sans-serif; }
      .muted { fill:#5f6975; font:400 12px system-ui,sans-serif; }
      .section { fill:#5f6975; font:600 11px system-ui,sans-serif; letter-spacing:1px; }
      .eventText { fill:#655093; font:600 13px system-ui,sans-serif; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#66717c"/></marker>
    <marker id="arrowCyan" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#4d99a7"/></marker>
    <marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#7b61b5"/></marker>
  </defs>
  <rect class="bg" width="1500" height="1040"/>
  <text class="title" x="48" y="48">Implemented runtime — retrieval first, relationships by request</text>
  <text class="subtitle" x="48" y="76">Current behavior at Neuve 7fc1d17. This sequence ends at qualified repository observations; it does not create review units or dispositions.</text>

  <g>
    <rect class="head" x="38" y="104" width="174" height="48" rx="9"/><text class="actor" x="125" y="133">Caller / agent</text>
    <rect class="headPublic" x="300" y="104" width="174" height="48" rx="9"/><text class="actor" x="387" y="133">Neuve CLI</text>
    <rect class="headBoundary" x="562" y="104" width="196" height="48" rx="9"/><text class="actor" x="660" y="133">Graph client boundary</text>
    <rect class="head" x="846" y="104" width="174" height="48" rx="9"/><text class="actor" x="933" y="133">Git repository</text>
    <rect class="headGraph" x="1108" y="104" width="174" height="48" rx="9"/><text class="actor" x="1195" y="133">Neuve Graph</text>
    <rect class="head" x="1350" y="104" width="112" height="48" rx="9"/><text class="actor" x="1406" y="133">Event sink</text>
    <line class="life" x1="125" y1="152" x2="125" y2="994"/>
    <line class="life" x1="387" y1="152" x2="387" y2="994"/>
    <line class="life" x1="660" y1="152" x2="660" y2="994"/>
    <line class="life" x1="933" y1="152" x2="933" y2="994"/>
    <line class="life" x1="1195" y1="152" x2="1195" y2="994"/>
    <line class="life" x1="1406" y1="152" x2="1406" y2="994"/>
  </g>

  <text class="section" x="48" y="190">REQUEST AND PINNED VIEW</text>
  <path class="msg" d="M125 218 H379"/><text class="text" x="160" y="210">query(question, revision, explicit relationship plan)</text>
  <path class="msg" d="M387 258 H652"/><text class="text" x="437" y="250">Validate request; discover Graph binary</text>
  <path class="msg" d="M660 298 H925"/><text class="text" x="720" y="290">Resolve commit and tree identity</text>
  <path class="return" d="M933 338 H668"/><text class="muted" x="753" y="330">full revision + tree</text>
  <path class="msg" d="M660 378 H925"/><text class="text" x="733" y="370">Create detached isolated worktree</text>
  <path class="return" d="M933 418 H668"/><text class="muted" x="738" y="410">exact committed view</text>

  <text class="section" x="48" y="462">PROVIDER DISCOVERY AND RETRIEVAL</text>
  <path class="msg" d="M660 490 H1187"/><text class="text" x="802" y="482">version + capabilities</text>
  <path class="return" d="M1195 530 H668"/><text class="muted" x="807" y="522">provider identity and declared capability limits</text>
  <path class="msg" d="M660 570 H1187"/><text class="text" x="804" y="562">unchanged natural-language query on isolated view</text>
  <path class="return" d="M1195 610 H668"/><text class="muted" x="775" y="602">raw results, budgets, diagnostics and partial failures</text>
  <path class="msg" d="M660 650 H925"/><text class="text" x="705" y="642">Qualify every source against pinned Git bytes</text>
  <path class="event" d="M660 690 H1398"/><text class="eventText" x="842" y="682">event 1 · retrieval — first caller-visible useful result</text>

  <text class="section" x="48" y="734">OPTIONAL ADDITIVE ENRICHMENT</text>
  <rect class="loop" x="570" y="748" width="724" height="134" rx="9"/>
  <text class="muted" x="586" y="772">For each explicit relationship request; empty plan skips this block entirely</text>
  <path class="msg" d="M660 806 H1187"/><text class="text" x="782" y="798">Resolve focus, then request relation + direction</text>
  <path class="return" d="M1195 842 H668"/><text class="muted" x="797" y="834">focus, observations, evidence, warnings, truncation</text>
  <path class="event" d="M660 870 H1398"/><text class="eventText" x="883" y="862">event N · relationship outcome</text>

  <text class="section" x="48" y="920">CLEANUP AND TERMINAL STATE</text>
  <path class="msg" d="M660 946 H925"/><text class="text" x="714" y="938">Remove worktree; recover and prune if needed</text>
  <path class="event" d="M660 982 H1398"/><text class="eventText" x="850" y="974">complete — emitted only after cleanup succeeds</text>

  <rect class="failure" x="48" y="1002" width="1404" height="28" rx="6"/>
  <text class="muted" x="62" y="1021">Cancellation, broken event delivery, command failure, or cleanup failure remains visible. Later work stops, cleanup is attempted, and a false completion event is not emitted.</text>
</svg>
