<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1120" viewBox="0 0 1560 1120" role="img" aria-labelledby="title desc">
  <title id="title">Intended Neuve product review sequence</title>
  <desc id="desc">Sequence diagram with Author, Git and scope sources, Neuve, Neuve Graph, the adversarial reviewer, and the final reviewer. It shows scope pinning, batch capture, review-unit construction, context retrieval, correction loops, final dispositions, and reuse or invalidation in a later cycle.</desc>
  <defs>
    <style>
      :root { color-scheme: light dark; }
      .bg { fill:#fbfaf7; }
      .head { fill:#eef0f2; stroke:#929ca6; }
      .headProduct { fill:#fff2d8; stroke:#b98934; }
      .headEngine { fill:#eee8fb; stroke:#7b61b5; }
      .life { stroke:#a7afb7; stroke-width:1.5; stroke-dasharray:6 7; }
      .msg { stroke:#66717c; stroke-width:1.7; fill:none; marker-end:url(#arrow); }
      .return { stroke:#7b61b5; stroke-width:1.7; stroke-dasharray:6 5; fill:none; marker-end:url(#arrowPurple); }
      .loop { fill:#fff8ea; stroke:#b98934; stroke-width:1.5; }
      .note { fill:#edf5eb; stroke:#5b8f58; }
      .title { fill:#20252b; font:600 28px system-ui,sans-serif; }
      .subtitle { fill:#5f6975; font:400 15px system-ui,sans-serif; }
      .actor { fill:#20252b; font:600 13px system-ui,sans-serif; text-anchor:middle; }
      .text { fill:#20252b; font:500 13px system-ui,sans-serif; }
      .muted { fill:#5f6975; font:400 12px system-ui,sans-serif; }
      .section { fill:#5f6975; font:600 11px system-ui,sans-serif; letter-spacing:1px; }
      .loopText { fill:#7e642f; font:600 12px system-ui,sans-serif; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#66717c"/></marker>
    <marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#7b61b5"/></marker>
  </defs>
  <rect class="bg" width="1560" height="1120"/>
  <text class="title" x="52" y="48">Product sequence — from scoped intent to attributed disposition</text>
  <text class="subtitle" x="52" y="76">Formal target behavior. Amber responsibilities belong to the Neuve product domain; purple interactions use the structural engine.</text>

  <g id="actors">
    <rect class="head" x="44" y="104" width="180" height="48" rx="9"/><text class="actor" x="134" y="133">Author / implementer</text>
    <rect class="head" x="294" y="104" width="180" height="48" rx="9"/><text class="actor" x="384" y="133">Git + scope sources</text>
    <rect class="headProduct" x="544" y="104" width="180" height="48" rx="9"/><text class="actor" x="634" y="133">Neuve product core</text>
    <rect class="headEngine" x="794" y="104" width="180" height="48" rx="9"/><text class="actor" x="884" y="133">Neuve Graph</text>
    <rect class="head" x="1044" y="104" width="180" height="48" rx="9"/><text class="actor" x="1134" y="133">Adversarial reviewer</text>
    <rect class="head" x="1294" y="104" width="220" height="48" rx="9"/><text class="actor" x="1404" y="133">Final agent / human reviewer</text>
    <line class="life" x1="134" y1="152" x2="134" y2="1060"/>
    <line class="life" x1="384" y1="152" x2="384" y2="1060"/>
    <line class="life" x1="634" y1="152" x2="634" y2="1060"/>
    <line class="life" x1="884" y1="152" x2="884" y2="1060"/>
    <line class="life" x1="1134" y1="152" x2="1134" y2="1060"/>
    <line class="life" x1="1404" y1="152" x2="1404" y2="1060"/>
  </g>

  <text class="section" x="52" y="190">SCOPE AND CAPTURE</text>
  <path class="msg" d="M134 218 H376"/><text class="text" x="185" y="210">Establish task authority and intended outcome</text>
  <path class="msg" d="M384 258 H626"/><text class="text" x="424" y="250">Pin scope, constraints and definition of done</text>
  <path class="msg" d="M134 298 H376"/><text class="text" x="194" y="290">Create or update current review batch</text>
  <path class="msg" d="M384 338 H626"/><text class="text" x="433" y="330">Git event + committed base + exact batch bytes</text>
  <rect class="note" x="546" y="354" width="176" height="58" rx="8"/>
  <text class="text" x="560" y="377">Create hunk-based units</text><text class="muted" x="560" y="397">Batch bytes remain unapproved</text>

  <text class="section" x="52" y="446">CONTEXT AND ATTRIBUTION</text>
  <path class="msg" d="M634 474 H876"/><text class="text" x="681" y="466">Query revision-bound repository context</text>
  <path class="return" d="M884 514 H642"/><text class="text" x="674" y="506">Qualified candidates, coverage and limitations</text>
  <path class="msg" d="M634 554 H876"/><text class="text" x="674" y="546">Request explicit structural relationships</text>
  <path class="return" d="M884 594 H642"/><text class="text" x="670" y="586">Observations, evidence ranges and warnings</text>
  <rect class="note" x="546" y="610" width="176" height="76" rx="8"/>
  <text class="text" x="560" y="633">Attribute markers to hunks</text><text class="muted" x="560" y="653">Build briefing; assess unit</text><text class="muted" x="560" y="671">without transferring trust</text>

  <text class="section" x="52" y="720">INNER DEVELOPMENT LOOP</text>
  <rect class="loop" x="74" y="736" width="1126" height="170" rx="10"/>
  <text class="loopText" x="90" y="758">LOOP · corrections here do not increment the external review-cycle count</text>
  <path class="msg" d="M634 790 H1126"/><text class="text" x="752" y="782">Send review units, briefing and evidence</text>
  <path class="msg" d="M1134 830 H142"/><text class="text" x="560" y="822">Request correction when premise, evidence or implementation fails</text>
  <path class="msg" d="M134 870 H376"/><text class="text" x="186" y="862">Change affected work and evidence</text>
  <path class="msg" d="M384 888 H626"/><text class="muted" x="407" y="880">Recapture; recluster; reuse unaffected valid material</text>

  <text class="section" x="52" y="946">FINAL REVIEW AND HISTORY</text>
  <path class="msg" d="M1134 972 H1396"/><text class="text" x="1176" y="964">Approve inner loop; forward completed obligations</text>
  <path class="msg" d="M1404 1012 H642"/><text class="text" x="918" y="1004">Record approval or request for changes per unit</text>
  <path class="msg" d="M634 1052 H376"/><text class="text" x="395" y="1044">Persist attribution to revision, evidence and correction history</text>

  <rect class="note" x="1014" y="1070" width="500" height="34" rx="7"/>
  <text class="muted" x="1028" y="1092">Later Git changes reuse valid material or raise a renewed decision signal.</text>
</svg>
