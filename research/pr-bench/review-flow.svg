<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="380" viewBox="0 0 1040 380" role="img" aria-labelledby="title description">
<title id="title">PR Bench must preserve the revision and available evidence at every review step</title>
<desc id="description">Observed provider history connects a submitted revision, a review concern, an author reply with a new revision, and a scoped provider decision. A proposed first-review task receives the submitted revision and eligible prior evidence. Later concerns, fixes and decisions stay hidden. Hydration and independent adjudication are still required.</desc>
<rect width="1040" height="380" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#172033">
<text x="32" y="38" font-size="22" font-weight="700">Evaluate the review at its own revision</text>
<text x="32" y="65" font-size="15">Observed history. Comments, replies, source patches and provider decisions remain distinct.</text>
<g fill="#fff" stroke="#b8c4d4"><rect x="32" y="92" width="215" height="92" rx="8"/><rect x="286" y="92" width="215" height="92" rx="8"/><rect x="540" y="92" width="215" height="92" rx="8"/><rect x="794" y="92" width="215" height="92" rx="8"/></g>
<g font-size="17" font-weight="700"><text x="48" y="120">Submitted revision</text><text x="302" y="120">Reviewer concern</text><text x="556" y="120">Reply + new revision</text><text x="810" y="120">Provider decision</text></g>
<g font-size="14"><text x="48" y="149">Exact source identity</text><text x="48" y="169">Available prior evidence</text><text x="302" y="149">Actor, source and anchor</text><text x="302" y="169">Claim requiring judgment</text><text x="556" y="149">Correction reference</text><text x="556" y="169">Verification kept separate</text><text x="810" y="149">Scope and revision matter</text><text x="810" y="169">Merge alone proves no fix</text></g>
<g stroke="#51637c" stroke-width="2" fill="none"><path d="M249 138 H278 l-7 -5 m7 5 l-7 5"/><path d="M503 138 H532 l-7 -5 m7 5 l-7 5"/><path d="M757 138 H786 l-7 -5 m7 5 l-7 5"/></g>
<path d="M266 84 V312" stroke="#b34235" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="32" y="222" width="215" height="78" rx="8" fill="#e8f2ea" stroke="#397747"/>
<text x="48" y="248" font-size="16" font-weight="700">Proposed model input</text><text x="48" y="271" font-size="14">Qualified revision + context</text>
<rect x="286" y="222" width="723" height="78" rx="8" fill="#fff0ed" stroke="#b34235"/>
<text x="302" y="248" font-size="16" font-weight="700">Hidden for a first-review task</text><text x="302" y="272" font-size="14">Later discussion, fixes, approvals and description edits can reveal the answer.</text>
<text x="32" y="342" font-size="15" font-weight="700">Still required before scoring</text><text x="32" y="365" font-size="14">Pinned repository hydration, checkpoint qualification, independent labels and a reserved change-family holdout.</text>
</g></svg>
