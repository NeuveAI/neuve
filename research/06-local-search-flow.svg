<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">A Graph search today and as proposed</title>
  <desc id="d">Today each search starts a Graph process, loads the prepared snapshot, and scans every blob of the base tree once per pattern before ranking. Proposed: at commit time, changed blobs are indexed in the background; a search reads posting lists, checks only candidate files, and reuses remembered answers.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>

  <text x="24" y="36" font-size="18" font-weight="600" fill="#111">Today: work grows with tree size × patterns, at query time</text>
  <g font-size="13" fill="#111">
    <rect x="24" y="56" width="150" height="64" rx="8" fill="#f2f2f2" stroke="#666"/>
    <text x="99" y="84" text-anchor="middle">Review needs leads</text>
    <text x="99" y="102" text-anchor="middle" fill="#555">waits for a slot</text>

    <rect x="204" y="56" width="160" height="64" rx="8" fill="#f2f2f2" stroke="#666"/>
    <text x="284" y="84" text-anchor="middle">New Graph process</text>
    <text x="284" y="102" text-anchor="middle" fill="#555">loads the snapshot</text>

    <rect x="394" y="48" width="300" height="80" rx="8" fill="#fde8e8" stroke="#b42318" stroke-width="2"/>
    <text x="544" y="74" text-anchor="middle" font-weight="600">git grep, one scan per pattern, in a small pool</text>
    <text x="544" y="94" text-anchor="middle">each reads every blob of the base tree</text>
    <text x="544" y="114" text-anchor="middle" fill="#b42318">before the pool: 47 patterns took 2 min 3 s</text>

    <rect x="724" y="56" width="210" height="64" rx="8" fill="#f2f2f2" stroke="#666"/>
    <text x="829" y="84" text-anchor="middle">Rank and answer</text>
    <text x="829" y="102" text-anchor="middle" fill="#555">nothing kept for next time</text>
  </g>
  <g stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="174" y1="88" x2="202" y2="88"/>
    <line x1="364" y1="88" x2="392" y2="88"/>
    <line x1="694" y1="88" x2="722" y2="88"/>
  </g>
  <text x="24" y="158" font-size="13" fill="#555">End-to-end check run logs: Graph median 11.3 s per search; the harness's per-blob text index median 12 ms.</text>

  <line x1="24" y1="186" x2="936" y2="186" stroke="#ccc"/>

  <text x="24" y="222" font-size="18" font-weight="600" fill="#111">Proposed: pay once per changed blob, ahead of time; a search reads and checks</text>

  <text x="24" y="252" font-size="12" font-weight="600" fill="#1d4ed8" letter-spacing="0.5">AT COMMIT, IN THE BACKGROUND SHARE OF THE BUDGET</text>
  <g font-size="13" fill="#111">
    <rect x="24" y="264" width="150" height="64" rx="8" fill="#e8effd" stroke="#1d4ed8"/>
    <text x="99" y="292" text-anchor="middle">Commit</text>
    <text x="99" y="310" text-anchor="middle" fill="#555">changed blobs only</text>

    <rect x="204" y="264" width="220" height="64" rx="8" fill="#e8effd" stroke="#1d4ed8"/>
    <text x="314" y="292" text-anchor="middle">Index each new blob once</text>
    <text x="314" y="310" text-anchor="middle" fill="#555">keyed by blob id, shared</text>

    <rect x="454" y="264" width="230" height="64" rx="8" fill="#e8effd" stroke="#1d4ed8"/>
    <text x="569" y="292" text-anchor="middle">Tree index = base + layer</text>
    <text x="569" y="310" text-anchor="middle" fill="#555">as Zoekt, Glean, CodeQL do</text>

    <rect x="714" y="264" width="220" height="64" rx="8" fill="#e8effd" stroke="#1d4ed8"/>
    <text x="824" y="292" text-anchor="middle">Lead searches answered</text>
    <text x="824" y="310" text-anchor="middle" fill="#555">stored for the review</text>
  </g>
  <g stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="174" y1="296" x2="202" y2="296"/>
    <line x1="424" y1="296" x2="452" y2="296"/>
    <line x1="684" y1="296" x2="712" y2="296"/>
  </g>

  <text x="24" y="372" font-size="12" font-weight="600" fill="#067647" letter-spacing="0.5">DURING A REVIEW</text>
  <g font-size="13" fill="#111">
    <rect x="24" y="384" width="150" height="64" rx="8" fill="#e7f6ec" stroke="#067647"/>
    <text x="99" y="412" text-anchor="middle">Review needs leads</text>
    <text x="99" y="430" text-anchor="middle" fill="#555">or an agent searches</text>

    <rect x="204" y="384" width="220" height="64" rx="8" fill="#e7f6ec" stroke="#067647"/>
    <text x="314" y="412" text-anchor="middle">Remembered answer?</text>
    <text x="314" y="430" text-anchor="middle" fill="#555">by blob and pattern</text>

    <rect x="454" y="384" width="230" height="64" rx="8" fill="#e7f6ec" stroke="#067647"/>
    <text x="569" y="412" text-anchor="middle">Read posting lists</text>
    <text x="569" y="430" text-anchor="middle" fill="#555">check candidate files only</text>

    <rect x="714" y="384" width="220" height="64" rx="8" fill="#e7f6ec" stroke="#067647"/>
    <text x="824" y="412" text-anchor="middle">Rank and answer</text>
    <text x="824" y="430" text-anchor="middle" fill="#555">cost follows matches</text>
  </g>
  <g stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="174" y1="416" x2="202" y2="416"/>
    <line x1="424" y1="416" x2="452" y2="416"/>
    <line x1="684" y1="416" x2="712" y2="416"/>
    <path d="M569 330 L569 382"/>
    <path d="M314 352 L314 382"/>
  </g>
  <g stroke="#444" stroke-width="1.5" fill="none">
    <path d="M824 330 L824 352 L577 352"/>
    <path d="M561 352 L314 352"/>
  </g>
  <text x="24" y="482" font-size="13" fill="#555">Fallback when a pattern has no usable literal (a two-letter abbreviation): one scan of the tree for all patterns together, not one per pattern.</text>
  <text x="24" y="504" font-size="13" fill="#555">Blue and green are proposals; the red step is where today's time goes.</text>
</svg>
